name: PR28275 frozen candidate verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    container:
      image: matrixorigin/golang:1.27.0-ubuntu22.04-matrixone-native-1
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
      CANDIDATE: ec59de3aaf2fe41cc1b26191df7499cde0c68369
      SOURCE: fc91f68a0a001cbfe01af73e467214dbc6c1c726
      BASE: 8d63bb709665a6ab084cd63c707a5771a2856f7d
      TREE: 4eb0e75046716f16e859b58124a31b6ab81eb0c9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ec59de3aaf2fe41cc1b26191df7499cde0c68369
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Identity and diff checks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr28275"
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TREE"
          test "$(git rev-parse HEAD^1)" = "$SOURCE"
          test "$(git rev-parse HEAD^2)" = "$BASE"
          git diff --check "$BASE" "$CANDIDATE" > "$RUNNER_TEMP/pr28275/diff-base.log" 2>&1
          if git diff --check "$SOURCE" "$CANDIDATE" > "$RUNNER_TEMP/pr28275/diff-source.log" 2>&1; then
            echo 'source-relative diff check: PASS' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'source-relative diff check: FAIL; see artifact' >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'candidate=%s\nsource=%s\nbase=%s\ntree=%s\n' "$CANDIDATE" "$SOURCE" "$BASE" "$TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v5
        with:
          go-version-file: candidate/go.mod
          cache: false
      - name: Build source-matched native inputs
        id: native
        run: |
          set -euo pipefail
          go version > "$RUNNER_TEMP/pr28275/toolchain.log"
          make cgo NATIVE_BUILD_JOBS=2 > "$RUNNER_TEMP/pr28275/native.log" 2>&1
      - name: Parser and tree package tests
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          .agents/skills/mo-dev/scripts/mo-cgo-test -count=1 -timeout=15m ./pkg/sql/parsers/dialect/mysql ./pkg/sql/parsers/tree > "$RUNNER_TEMP/pr28275/parser.log" 2>&1
      - name: JSON, byte validation and temporal packages
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          .agents/skills/mo-dev/scripts/mo-cgo-test -count=1 -timeout=15m ./pkg/container/bytejson ./pkg/internal/bytejsonvalidate ./pkg/container/types ./pkg/pb/plan > "$RUNNER_TEMP/pr28275/data.log" 2>&1
      - name: Planner and function focused tests
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          for pkg in ./pkg/sql/plan ./pkg/sql/plan/function; do
            .agents/skills/mo-dev/scripts/mo-cgo-test -list 'JSONValue|JSONValid|Persisted' "$pkg" > "$RUNNER_TEMP/pr28275/$(basename "$pkg")-selection.log" 2>&1
            grep -q '^Test' "$RUNNER_TEMP/pr28275/$(basename "$pkg")-selection.log"
            .agents/skills/mo-dev/scripts/mo-cgo-test -count=1 -timeout=15m -run 'JSONValue|JSONValid|Persisted' "$pkg" > "$RUNNER_TEMP/pr28275/$(basename "$pkg")-tests.log" 2>&1
          done
      - name: Protocol and public SQL integration tests
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          for pkg in ./pkg/sql/compile ./pkg/tests/sqlintegration; do
            .agents/skills/mo-dev/scripts/mo-cgo-test -list 'JSONValue|ExpressionProtocol|RemoteExpression|AllCNsSupportProtocol' "$pkg" > "$RUNNER_TEMP/pr28275/$(basename "$pkg")-selection.log" 2>&1
            grep -q '^Test' "$RUNNER_TEMP/pr28275/$(basename "$pkg")-selection.log"
            .agents/skills/mo-dev/scripts/mo-cgo-test -count=1 -timeout=20m -run 'JSONValue|ExpressionProtocol|RemoteExpression|AllCNsSupportProtocol' "$pkg" > "$RUNNER_TEMP/pr28275/$(basename "$pkg")-tests.log" 2>&1
          done
      - name: Scoped vet
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/cgo -I$PWD/thirdparties/install/include"
          export CGO_LDFLAGS="-L$PWD/thirdparties/install/lib"
          go vet -mod=readonly ./pkg/common/moerr ./pkg/container/bytejson ./pkg/container/types ./pkg/container/vector ./pkg/defines ./pkg/frontend ./pkg/internal/bytejsonvalidate ./pkg/pb/plan ./pkg/sql/compile ./pkg/sql/parsers/dialect/mysql ./pkg/sql/parsers/tree ./pkg/sql/plan ./pkg/sql/plan/function ./pkg/tests/sqlintegration > "$RUNNER_TEMP/pr28275/vet.log" 2>&1
      - name: Scoped lint
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          export CGO_CFLAGS="-I$PWD/cgo -I$PWD/thirdparties/install/include"
          export CGO_LDFLAGS="-L$PWD/thirdparties/install/lib"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest > "$RUNNER_TEMP/pr28275/lint-install.log" 2>&1
          "$(go env GOPATH)/bin/golangci-lint" version >> "$RUNNER_TEMP/pr28275/toolchain.log"
          "$(go env GOPATH)/bin/golangci-lint" run -c .golangci.yml --new-from-rev "$BASE" ./pkg/common/moerr ./pkg/container/bytejson ./pkg/container/types ./pkg/container/vector ./pkg/defines ./pkg/frontend ./pkg/internal/bytejsonvalidate ./pkg/pb/plan ./pkg/sql/compile ./pkg/sql/parsers/dialect/mysql ./pkg/sql/parsers/tree ./pkg/sql/plan ./pkg/sql/plan/function ./pkg/tests/sqlintegration > "$RUNNER_TEMP/pr28275/lint.log" 2>&1
      - uses: actions/setup-java@v4
        if: always() && steps.native.outcome == 'success'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/checkout@v4
        if: always() && steps.native.outcome == 'success'
        with:
          repository: matrixorigin/mo-tester
          ref: 309a0ca650e0c55e90292767fd61e4976818d66d
          path: mo-tester
          persist-credentials: false
      - name: Build service and execute selected BVT
        if: always() && steps.native.outcome == 'success'
        run: |
          set -euo pipefail
          apt-get update > "$RUNNER_TEMP/pr28275/apt.log" 2>&1
          DEBIAN_FRONTEND=noninteractive apt-get install -y mariadb-client >> "$RUNNER_TEMP/pr28275/apt.log" 2>&1
          make build > "$RUNNER_TEMP/pr28275/build.log" 2>&1
          ./mo-service -launch ./etc/quickstart/launch.toml > "$RUNNER_TEMP/pr28275/service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true; wait "$service_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 300); do
            if MYSQL_PWD=111 mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 6001 -u dump -e 'select 1' > "$RUNNER_TEMP/pr28275/readiness.log" 2>&1; then ready=1; break; fi
            kill -0 "$service_pid" 2>/dev/null || break
            sleep 1
          done
          test "$ready" = 1
          cd "$GITHUB_WORKSPACE/mo-tester"
          for spec in "function/func_json_value.test" "function/func_json_value_float.sql" "fulltext2/fulltext2_token_filter.sql"; do
            name=${spec##*/}
            status=0
            ./run.sh -n -g -p "$GITHUB_WORKSPACE/candidate/test/distributed/cases/$spec" > "$RUNNER_TEMP/pr28275/bvt-$name.log" 2>&1 || status=$?
            cp -R report "$RUNNER_TEMP/pr28275/report-$name"
            test "$status" = 0
            grep -F "$name" report/report.txt > /dev/null
            python3 -c 'import re,sys; s=open(sys.argv[1]).read(); name=sys.argv[2]; rows=[l for l in s.splitlines() if name in l]; assert rows and any(re.search(r"SUCCESS\s*:\s*[1-9][0-9]*",l) and re.search(r"FAILED\s*:\s*0(?:\D|$)",l) and re.search(r"ABNOR[A-Z]*\s*:\s*0(?:\D|$)",l) for l in rows), rows' report/report.txt "$name"
          done
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28275-frozen-verification
          path: ${{ runner.temp }}/pr28275
          if-no-files-found: warn
          retention-days: 14
