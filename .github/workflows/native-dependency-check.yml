name: Native Dependency Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - name: Resolve immutable CI builder
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull matrixorigin/matrixone:ci-builder >/dev/null
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
  candidate:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: "29057"
            role: "29057"
            head: 8e65f80ff74ad00fa6e2b9ebedb7ebc8368a1e75
            tree: e4fff3db15f7397769a2f2dd70f65a256d4342d1
    steps:
      - name: Checkout frozen control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-ready-bvt
          persist-credentials: false
      - name: Checkout exact MatrixOne source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/matrixone
          ref: ${{ matrix.head }}
          path: subject
          persist-credentials: false
      - name: Checkout pinned canonical tester
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/mo-tester
          ref: 309a0ca650e0c55e90292767fd61e4976818d66d
          path: tester
          sparse-checkout: |
            /lib/
            /mo.yml
            /run.yml
            /log4j.properties
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run isolated tree-verified candidate BVT
        shell: bash
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          PR: ${{ matrix.pr }}
          EXPECTED: ${{ matrix.head }}
          TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          printf '%s\n' "$IMAGE" > "$RUNNER_TEMP/results/image.txt"
          docker pull "$IMAGE" >/dev/null
          docker run --rm --init --cpus=2 --memory=8g --pids-limit=2048 \
            -v "$GITHUB_WORKSPACE/subject:/go/src/github.com/matrixorigin/matrixone" \
            -v "$GITHUB_WORKSPACE/control/.github/ci/codex-ready-bvt:/control:ro" \
            -v "$GITHUB_WORKSPACE/tester:/tester:ro" \
            -v "$JAVA_HOME:/jdk:ro" \
            -v "$RUNNER_TEMP/results:/out" \
            -w /go/src/github.com/matrixorigin/matrixone \
            "$IMAGE" bash /control/probe.sh "$PR" "$EXPECTED" "$TREE"
      - name: Make container evidence readable to the runner
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-contrast-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 7
