name: Native Dependency Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  predecessor:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout immutable control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-ready-static
          persist-credentials: false
      - name: Checkout exact candidate parent
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/matrixone
          ref: 536b2aa3e5f130691492822c477cbbf872fae0e6
          path: subject
          persist-credentials: false
      - name: Establish resources and official release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results/release"
          df -Pk "$RUNNER_TEMP" > "$RUNNER_TEMP/results/disk-preflight.txt"
          awk '/MemAvailable/ {print}' /proc/meminfo > "$RUNNER_TEMP/results/memory-preflight.txt"
          awk 'NR==2 { if ($4 < 7340032) exit 1 }' "$RUNNER_TEMP/results/disk-preflight.txt"
          curl --fail --location --silent --show-error --retry 2 -o "$RUNNER_TEMP/release.zip" https://github.com/matrixorigin/matrixone/releases/download/v4.2.6/mo-v4.2.6-linux-x86_64.zip
          printf '%s  %s\n' 68942ece0c1643a28a356d06ce495d7e6b8d5d522c49ac868decb85b0efb0882 "$RUNNER_TEMP/release.zip" | sha256sum -c > "$RUNNER_TEMP/results/release-archive-check.txt"
          unzip -q "$RUNNER_TEMP/release.zip" -d "$RUNNER_TEMP/results/release"
          sha256sum "$RUNNER_TEMP/release.zip" > "$RUNNER_TEMP/results/release-archive-sha256.txt"
      - name: Execute isolated predecessor and candidate lifecycle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/results"
          name="pr28935-lifecycle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            set +e
            if docker inspect "$name" >/dev/null 2>&1; then docker stop --time 60 "$name" >/dev/null 2>&1; fi
            if docker inspect "$name" >/dev/null 2>&1; then docker rm -f "$name" >/dev/null 2>&1; fi
            if docker inspect "$name" >/dev/null 2>&1; then printf '%s\n' FAIL > "$out/container-cleanup.txt"; else printf '%s\n' PASS > "$out/container-cleanup.txt"; fi
          }
          trap cleanup EXIT INT TERM
          docker pull matrixorigin/matrixone:ci-builder > "$out/image-pull.log" 2>&1
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$image" > "$out/image.txt"
          timeout --signal=TERM --kill-after=70s 100m docker run --name "$name" --init --network host --cpus=4 --memory=12g --pids-limit=2048 \
            -v "$GITHUB_WORKSPACE/subject:/subject" \
            -v "$GITHUB_WORKSPACE/control/.github/ci/codex-ready-static:/control:ro" \
            -v "$out:/out" -w /subject "$image" bash -c \
            'set -e; python3 -m pip install --disable-pip-version-check --target /tmp/pr28935-python PyMySQL==1.1.1 > /out/python-install.log 2>&1; PYTHONPATH=/tmp/pr28935-python python3 /control/lifecycle.py > /out/controller.log 2>&1'
      - name: Make evidence readable
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - name: Retain lifecycle receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr28935-predecessor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/results/*.json
            ${{ runner.temp }}/results/*.txt
            ${{ runner.temp }}/results/*.log
            ${{ runner.temp }}/results/*.toml
            ${{ runner.temp }}/results/*.fingerprint
          if-no-files-found: warn
          retention-days: 7
