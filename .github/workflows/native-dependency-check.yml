name: PR31460 compatibility candidate validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        kind: [rename, show, inner_object, static]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/pr31460
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: VioletQwQ-0/matrixone
          ref: 81bcb78a7872f92c48f13503261abcc119a54caf
          path: subject
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        if: matrix.kind != 'static'
        with:
          repository: matrixorigin/mo-tester
          ref: 309a0ca650e0c55e90292767fd61e4976818d66d
          path: tester
          sparse-checkout: |
            /lib/
            /mo.yml
            /run.yml
            /log4j.properties
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: matrix.kind != 'static'
        with:
          distribution: temurin
          java-version: '17'
      - name: Execute isolated validation
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          docker pull matrixorigin/matrixone:ci-builder >/dev/null
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$image" > "$RUNNER_TEMP/results/image.txt"
          args=(--rm --init --cpus=2 --memory=8g --pids-limit=2048 -v "$GITHUB_WORKSPACE/subject:/go/src/github.com/matrixorigin/matrixone" -v "$GITHUB_WORKSPACE/control/.github/ci/pr31460/$KIND:/control:ro" -v "$RUNNER_TEMP/results:/out" -w /go/src/github.com/matrixorigin/matrixone)
          if [ "$KIND" != static ]; then args+=(-v "$GITHUB_WORKSPACE/tester:/tester:ro" -v "$JAVA_HOME:/jdk:ro"); fi
          docker run "${args[@]}" "$image" bash /control/probe.sh
      - name: Verify rename evidence
        if: always() && matrix.kind == 'rename'
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/results/test-exit.txt"
          python3 "$GITHUB_WORKSPACE/control/.github/ci/pr31460/rename/verify.py" "$RUNNER_TEMP/results/test.jsonl" "$RUNNER_TEMP/results/bvt/canonical-summary.json" "$(cat "$RUNNER_TEMP/results/test-exit.txt")" > "$RUNNER_TEMP/results/verification.txt" 2>&1
      - name: Retain evidence
        if: always()
        run: if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr31460-${{ matrix.kind }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 14
