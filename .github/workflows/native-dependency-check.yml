name: Native Dependency Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout frozen control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-ready-static
          persist-credentials: false
      - name: Checkout exact published revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/matrixone
          ref: 9cf8743ed7b6b4269f50179f1b09664a7582f4e7
          path: subject
          persist-credentials: false
      - name: Run scoped static checks in isolated image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          docker pull matrixorigin/matrixone:ci-builder >/dev/null
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$image" > "$RUNNER_TEMP/results/image.txt"
          docker run --rm --init --cpus=4 --memory=12g --pids-limit=2048 \
            -v "$GITHUB_WORKSPACE/subject:/go/src/github.com/matrixorigin/matrixone" \
            -v "$GITHUB_WORKSPACE/control/.github/ci/codex-ready-static:/control:ro" \
            -v "$RUNNER_TEMP/results:/out" \
            -w /go/src/github.com/matrixorigin/matrixone \
            "$image" bash /control/probe.sh
      - name: Make evidence readable to runner
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-merged-28444-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 7

  mysql-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-ready-static
          persist-credentials: false
      - name: Compare original scenario on MySQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mysql-result"
          name="qa-28162-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="$(openssl rand -hex 16)"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker pull mysql:8.0 >/dev/null
          docker image inspect --format '{{index .RepoDigests 0}}' mysql:8.0 > "$RUNNER_TEMP/mysql-result/image.txt"
          docker run -d --name "$name" -e MYSQL_ROOT_HOST=% -e "MYSQL_ROOT_PASSWORD=$password" -p 127.0.0.1::3306 mysql:8.0 >/dev/null
          ready=0
          for i in $(seq 1 90); do
            if docker exec -e "MYSQL_PWD=$password" "$name" mysqladmin -uroot ping --silent >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          port="$(docker port "$name" 3306/tcp | awk -F: 'NR==1 {print $NF}')"
          python3 -m venv "$RUNNER_TEMP/mysql-client"
          "$RUNNER_TEMP/mysql-client/bin/pip" install --quiet pymysql==1.1.1
          QA_MYSQL_PORT="$port" QA_MYSQL_PASSWORD="$password" "$RUNNER_TEMP/mysql-client/bin/python" control/.github/ci/codex-ready-static/mysql_reference.py > "$RUNNER_TEMP/mysql-result/result.json"
          docker stop "$name" >/dev/null
          docker rm "$name" >/dev/null
          trap - EXIT
          if docker inspect "$name" >/dev/null 2>&1; then exit 1; fi
          echo verified_removed > "$RUNNER_TEMP/mysql-result/cleanup.txt"
      - name: Retain reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-28162-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mysql-result
          if-no-files-found: warn
          retention-days: 7
