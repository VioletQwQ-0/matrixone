name: Native Dependency Checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout frozen control
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-ready-static
          persist-credentials: false
      - name: Checkout exact published revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/matrixone
          ref: 8e65f80ff74ad00fa6e2b9ebedb7ebc8368a1e75
          path: subject
          persist-credentials: false
      - name: Run scoped static checks in isolated image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          docker pull matrixorigin/matrixone:ci-builder >/dev/null
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$image" > "$RUNNER_TEMP/results/image.txt"
          docker run --rm --init --cpus=4 --memory=12g --pids-limit=2048 \
            -v "$GITHUB_WORKSPACE/subject:/go/src/github.com/matrixorigin/matrixone" \
            -v "$GITHUB_WORKSPACE/control/.github/ci/codex-ready-static:/control:ro" \
            -v "$RUNNER_TEMP/results:/out" \
            -w /go/src/github.com/matrixorigin/matrixone \
            "$image" bash /control/probe.sh
      - name: Make evidence readable to runner
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - name: Retain bounded validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-static-29057-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          if-no-files-found: warn
          retention-days: 7
