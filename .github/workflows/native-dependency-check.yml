name: PR31460 Combined Candidate Control
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-combined-static
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: VioletQwQ-0/matrixone
          ref: 8e16aee7a230204cc57582ab818cce392cc2e4ff
          path: subject
          persist-credentials: false
      - name: Run combined tests vet and race
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          docker pull matrixorigin/matrixone:ci-builder >/dev/null
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$image" > "$RUNNER_TEMP/results/image.txt"
          docker run --rm --init --cpus=4 --memory=12g --pids-limit=2048 -v "$GITHUB_WORKSPACE/subject:/go/src/github.com/matrixorigin/matrixone" -v "$GITHUB_WORKSPACE/control/.github/ci/codex-combined-static:/control:ro" -v "$RUNNER_TEMP/results:/out" -w /go/src/github.com/matrixorigin/matrixone "$image" bash /control/probe.sh
      - name: Retain evidence
        if: always()
        run: if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr31460-combined-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 14
  bvt:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          path: control
          sparse-checkout: .github/ci/codex-combined-bvt
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: VioletQwQ-0/matrixone
          ref: 8e16aee7a230204cc57582ab818cce392cc2e4ff
          path: subject
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/mo-tester
          ref: 309a0ca650e0c55e90292767fd61e4976818d66d
          path: tester
          sparse-checkout: |
            /lib/
            /mo.yml
            /run.yml
            /log4j.properties
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run real multi-session comparison
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results"
          docker pull matrixorigin/matrixone:ci-builder >/dev/null
          image="$(docker image inspect --format '{{index .RepoDigests 0}}' matrixorigin/matrixone:ci-builder)"
          case "$image" in *@sha256:*) ;; *) exit 1 ;; esac
          printf '%s\n' "$image" > "$RUNNER_TEMP/results/image.txt"
          docker run --rm --init --cpus=2 --memory=8g --pids-limit=2048 -v "$GITHUB_WORKSPACE/subject:/go/src/github.com/matrixorigin/matrixone" -v "$GITHUB_WORKSPACE/control/.github/ci/codex-combined-bvt:/control:ro" -v "$GITHUB_WORKSPACE/tester:/tester:ro" -v "$JAVA_HOME:/jdk:ro" -v "$RUNNER_TEMP/results:/out" -w /go/src/github.com/matrixorigin/matrixone "$image" bash /control/probe.sh
      - name: Retain evidence
        if: always()
        run: if test -d "$RUNNER_TEMP/results"; then sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/results"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr31460-combined-bvt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/results
          retention-days: 14
